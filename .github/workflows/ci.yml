name: AutoPOS CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/autopos
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXlfY2xlcms
      CLERK_SECRET_KEY: sk_test_dummy
      GEMINI_API_KEY: dummy
      TYPESAFE_API_KEY: dummy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Build Docker Image
        run: >
          docker build -t autopos
          --build-arg DATABASE_URL="${{ env.DATABASE_URL }}"
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
          --build-arg CLERK_SECRET_KEY="${{ env.CLERK_SECRET_KEY }}"
          --build-arg GEMINI_API_KEY="${{ env.GEMINI_API_KEY }}"
          --build-arg TYPESAFE_API_KEY="${{ env.TYPESAFE_API_KEY }}"
          .